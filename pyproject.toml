[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "migrations",
  "android-app/.gradle",
  "android-app/build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"app/blueprints/*/__init__.py" = ["F401", "F403"]
"app/models/__init__.py" = ["F403"]
"migrations/versions/*.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
