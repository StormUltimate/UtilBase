{# Переиспользуемые фрагменты план-графика (копируемый модуль). #}
{% macro schedule_nav_tabs(shifts_url) %}
<ul class="nav nav-tabs mb-3 flex-wrap" role="tablist">
    <li class="nav-item">
        <span class="nav-link active" aria-current="page">
            <i class="bi bi-calendar3"></i> План-график
        </span>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="{{ shifts_url }}"><i class="bi bi-clock-history"></i> Смены</a>
    </li>
</ul>
{% endmacro %}

{% macro legend_item(label, class_name) %}
<div class="schedule-legend-item d-flex align-items-center gap-2 mb-1">
    <span class="schedule-legend-swatch {{ class_name }}"></span>
    <span class="small">{{ label }}</span>
</div>
{% endmacro %}
