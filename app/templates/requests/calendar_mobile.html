<!-- Path: app/templates/requests/calendar_mobile.html — мобильный календарь (тот же модальный просмотр) -->
{% extends "base.html" %}
{% block title %}Календарь{% endblock %}

{% block content %}
    <h1 class="h5 mb-2">Мой календарь</h1>
    <div class="form-check form-switch form-check-reverse mb-2 small">
        <input class="form-check-input" type="checkbox" id="fcLayerShiftM" checked>
        <label class="form-check-label" for="fcLayerShiftM">График 9:00–19:00</label>
    </div>

    <div class="modal fade" id="requestCalendarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h5 class="modal-title"><i class="bi bi-ticket-perforated"></i> Заявка <span id="modalReqNumber"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body small" id="requestCalendarModalBody"><p class="text-muted mb-0">Загрузка…</p></div>
                <div class="modal-footer flex-wrap gap-2 py-2">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Закрыть</button>
                    <a id="modalBtnFull" class="btn btn-primary btn-sm" href="#">Полная карточка</a>
                    <a id="modalBtnEdit" class="btn btn-outline-primary btn-sm d-none" href="#">Редактировать</a>
                </div>
            </div>
        </div>
    </div>

    <div id="calendar"></div>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        function summaryUrl(id) { return '/requests/api/request/' + id + '/summary'; }
        function escapeHtml(s) {
            if (!s) return '';
            var d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }
        var modalEl = document.getElementById('requestCalendarModal');
        var modalBody = document.getElementById('requestCalendarModalBody');
        var modalReqNumber = document.getElementById('modalReqNumber');
        var modalBtnFull = document.getElementById('modalBtnFull');
        var modalBtnEdit = document.getElementById('modalBtnEdit');
        var bsModal = new bootstrap.Modal(modalEl);

        function fillModal(data) {
            modalReqNumber.textContent = data.request_number || data.id;
            modalBtnFull.href = data.view_url || '#';
            if (data.can_edit) {
                modalBtnEdit.href = data.edit_url || '#';
                modalBtnEdit.classList.remove('d-none');
            } else {
                modalBtnEdit.classList.add('d-none');
            }
            var html = '<dl class="row mb-0 small">';
            html += '<dt class="col-4 text-muted">Клиент</dt><dd class="col-8">' + escapeHtml(data.client_name) + '</dd>';
            html += '<dt class="col-4 text-muted">Адрес</dt><dd class="col-8">' + escapeHtml(data.address) + '</dd>';
            html += '<dt class="col-4 text-muted">План</dt><dd class="col-8">' + escapeHtml(data.planned_date) + '</dd>';
            html += '<dt class="col-4 text-muted">Тип выезда</dt><dd class="col-8">' + escapeHtml(String(data.visit_type_label || '—')) + '</dd>';
            html += '<dt class="col-4 text-muted">Описание</dt><dd class="col-8">' + escapeHtml(data.description) + '</dd>';
            html += '</dl>';
            modalBody.innerHTML = html;
        }

        var calendarEl = document.getElementById('calendar');
        var shiftBgUrl = {{ url_for('requests.api_shift_backgrounds') | tojson }};
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridDay',
            eventSources: [
                '/requests/api/events',
                {
                    url: shiftBgUrl,
                    extraParams: function() {
                        var el = document.getElementById('fcLayerShiftM');
                        return { show: el && el.checked ? '1' : '0' };
                    }
                }
            ],
            editable: false,
            locale: 'ru',
            firstDay: 1,
            slotEventOverlap: false,
            eventMinHeight: 22,
            slotDuration: '00:30:00',
            headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
            slotMinTime: '08:00:00',
            slotMaxTime: '20:00:00',
            height: 'auto',
            allDaySlot: false,
            eventClick: function(info) {
                info.jsEvent.preventDefault();
                if (info.event.extendedProps && info.event.extendedProps.layer === 'shift') {
                    return;
                }
                modalBody.innerHTML = '<p class="text-muted">Загрузка…</p>';
                bsModal.show();
                fetch(summaryUrl(info.event.id))
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.error) { modalBody.innerHTML = '<p class="text-danger">Нет доступа</p>'; return; }
                        fillModal(data);
                    })
                    .catch(function() { modalBody.innerHTML = '<p class="text-danger">Ошибка</p>'; });
            },
            eventContent: function(arg) {
                if (arg.view.type === 'timeGridDay') {
                    var time = arg.timeText || '';
                    var title = (arg.event.title || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
                    return { html: '<div class="fc-cal-compact-m" title="' + title + '">' + time + '</div>' };
                }
                return undefined;
            }
        });
        calendar.render();
        var fcLayerShiftM = document.getElementById('fcLayerShiftM');
        if (fcLayerShiftM) {
            fcLayerShiftM.addEventListener('change', function() {
                calendar.refetchEvents();
            });
        }
    });
    </script>
    <style>
        #calendar { width: 100%; margin: 12px auto; }
        .fc-cal-compact-m { font-size: 0.7rem; line-height: 1.2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .fc-timegrid-event { overflow: hidden; border-radius: 3px; }
        .fc-timegrid-slot { height: 2.25em; }
        @media (max-width: 768px) { #calendar { font-size: 13px; } }
    </style>
{% endblock %}
